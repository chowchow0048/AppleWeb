{% extends 'main/main_base.html' %}
{% load static %}

{% block extra_css %}
<link href="{% static 'css/main/main_home.css' %}" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="review-detail-container">
    <header class="review-detail-header">
        <h1 class="review-detail-title">{{ review.title }}</h1>
        <div class="author-info">
            <div class="info-item">
                <span class="info-label">이름</span>
                <span>{{ review.name }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">대학교</span>
                <span>{{ review.university }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">학과</span>
                <span>{{ review.major }}</span>
            </div>
        </div>
    </header>
    
    {% if review.image %}
    <div class="review-image-container">
        <img 
            src="{{ review.image.url }}" 
            class="review-image" 
            alt="{{ review.title }}"
            onclick="openImageInNewWindow('{{ review.image.url }}')"
        >
    </div>
    {% endif %}
    
    <div class="review-detail-content">
        {{ review.content|safe }}
    </div>
</div>

<script>
    function openImageInNewWindow(url) {
        window.open(url, '_blank', 'width=800,height=600');
    }
</script>
{% endblock %}
