[build]
# Railway가 Python 프로젝트를 자동으로 감지하도록 설정
# builder 설정을 제거하여 Railway의 Nixpacks 자동 감지 사용

[deploy]
# 정적 파일 수집과 마이그레이션은 release 명령에서 실행
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
# 프로덕션 환경 변수 설정
DJANGO_SETTINGS_MODULE = "config.settings.railway"
PYTHONPATH = "/app/appleWeb"

[environments.production.variables]
# 기본 환경 변수들
DEBUG = "False"
DJANGO_LOG_LEVEL = "INFO"
APP_LOG_LEVEL = "INFO" 