[build]
# Railway가 Python 프로젝트를 자동으로 감지하도록 설정
# Nixpacks가 자동으로 Python 환경을 설정합니다
# 빌드 단계에서는 데이터베이스 연결이 불가능하므로 정적 파일만 수집

[deploy]
# 재시작 정책 설정
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
# 프로덕션 환경 변수 설정
DJANGO_SETTINGS_MODULE = "config.settings.railway"
PYTHONPATH = "/app/appleWeb"

[environments.production.variables]
# 기본 환경 변수들
DEBUG = "False"
DJANGO_LOG_LEVEL = "INFO"
APP_LOG_LEVEL = "INFO"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1" 